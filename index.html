<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mushtak Attar | Virtual Business Card</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="card">

        <!-- Profile Section -->
        <div class="profile-section">
            <img src="assets/profile.png" alt="Profile Photo">
        </div>

        <!-- Info Section -->
        <div class="info-section">
            <h1>Mushtak Attar</h1>
            <h3>Full Stack Developer</h3>

            <!-- Typing Bio -->
            <p class="bio">
                <span id="typingText"></span>
            </p>

            <!-- Contact Info -->
            <div class="contact">
                <p>
                    <i class="fa-solid fa-envelope"></i>
                    Mushtak000007@gmail.com
                </p>
                <p>
                    <i class="fa-solid fa-phone"></i>
                    +91 8421098186
                </p>
            </div>

            <!-- Social Links -->
            <div class="social-links">
                <a href="https://github.com/mushtak7" target="_blank" title="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>

                <a href="https://www.instagram.com/" target="_blank" title="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>
            </div>

            <!-- Action Buttons -->
            <div class="actions">
                <button id="darkModeToggle" title="Toggle Dark Mode">
                    <i class="fa-solid fa-moon"></i>
                </button>

                <a href="assets/mushtak-attar.vcf" download class="vcard-btn">
                    Download vCard
                </a>
            </div>

            <!-- QR Code -->
            <div id="qrCode"></div>
        </div>

    </main>

    <!-- QR Code Library (MUST COME FIRST) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Custom JS -->
    <script src="script.js"></script>

</body>
</html>
