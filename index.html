<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mushtak Attar – Digital Business Card</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <div class="card">

    <!-- Profile -->
    <div class="profile">
      <img src="profile.png" alt="Profile Photo">
    </div>

    <!-- Info -->
    <h1>Mushtak Attar</h1>
    <p class="role">Full Stack Developer</p>

    <!-- Animated Tagline -->
    <p class="tagline">
      <span id="typing"></span>
    </p>

    <!-- Social Links -->
    <div class="socials">
      <a href="#" title="GitHub"><i class="fab fa-github"></i></a>
      <a href="#" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
      <a href="#" title="Instagram"><i class="fab fa-instagram"></i></a>
    </div>

    <!-- Actions -->
    <div class="actions">
      <a href="Mushtak.vcf" download class="btn primary">
        <i class="fa-solid fa-address-card"></i> Save Contact
      </a>

      <button id="themeToggle" class="btn secondary">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>

    <!-- QR Section -->
    <div class="qr-section">
      <p>Scan to save contact</p>
      <div id="qrCode"></div>
    </div>

  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="script.js"></script>
</body>
</html>
